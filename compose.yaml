services:
  app:
    build: ./atlas-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_port: 5432
      DB_NAME: ${DATABASE_NAME}
      DB_USER: ${DATABASE_USER}
      DB_PASSWORD: ${DATABASE_PASSWORD} 
    depends_on:
     - db

  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - atlas_db_fresh:/var/lib/postgresql

  nginx:
    image: nginx:alpine
    ports:
     - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
     - app

volumes:
  atlas_db_fresh:       