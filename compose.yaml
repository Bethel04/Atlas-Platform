services:
  app:
    build: ./atlas-app
    ports:
      - "8080:8080"
    depends_on:
     - db

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: atlas_notes
      POSTGRES_USER: atlas_app_user
      POSTGRES_PASSWORD: atlas_db_password
    volumes:
      - atlas_db_data:/var/lib/postgresql

  nginx:
    image: nginx:alpine
    ports:
     - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
     - app

volumes:
  atlas_db_data:       